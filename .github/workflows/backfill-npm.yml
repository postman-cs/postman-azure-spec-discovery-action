name: Backfill npm

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Ordered space-separated immutable tags, oldest first
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish immutable release assets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; fi
          PACKAGE_NAME='@postman-cs/onboarding-azure-spec-discovery'
          for TAG in $TAGS; do
            DIRECTORY=$(mktemp -d)
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release.tgz' --dir "$DIRECTORY"
            TARBALL="$DIRECTORY/release.tgz"
            IDENTITY=$(tar -xOf "$TARBALL" package/package.json)
            NAME=$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$IDENTITY")
            VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$IDENTITY")
            if [ "$NAME" != "$PACKAGE_NAME" ] || [ "$VERSION" != "${TAG#v}" ]; then
              echo "::error::release asset $TAG does not contain $PACKAGE_NAME@${TAG#v}"
              exit 1
            fi
            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PACKAGE_NAME@$VERSION already exists; skipping"
            else
              npm publish "$TARBALL" --provenance --access public --tag backfill
            fi
          done
          VERSIONS=$(npm view "$PACKAGE_NAME" versions --json)
          LATEST=$(node -e 'const versions=JSON.parse(process.argv[1]); const values=Array.isArray(versions) ? versions : [versions]; const valid=values.filter((v) => /^\d+\.\d+\.\d+$/.test(v)).sort((a,b) => a.split(".").map(Number).reduce((r,n,i) => r || n - b.split(".").map(Number)[i], 0)); if (!valid.length) process.exit(1); console.log(valid.at(-1));' "$VERSIONS")
          npm dist-tag add "$PACKAGE_NAME@$LATEST" latest
